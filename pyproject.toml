[project]
name = "cgm-insights"
version = "0.1.0"
description = "CGM data analysis library for glucose insights"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.40.0",
    "fastexcel>=0.7.0",
    "glucostats>=1.0.0",
    "pydantic>=2.13.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",
    "pyarrow>=14.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "asciichartpy>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.0",
]

[project.scripts]
cgm-insights = "cgm_insights.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgm_insights"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]