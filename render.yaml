services:
  - type: web
    name: cgm-insights
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: ALLOWED_ORIGINS
        sync: false  # set to https://<your-app>.onrender.com in the Render dashboard
